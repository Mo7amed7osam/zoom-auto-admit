name: Publish web-v0.2.0 attendance update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-web-v0.2.0.yml"
      - "web-extension/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-extension/package-lock.json

      - name: Build distributable extension
        working-directory: web-extension
        run: |
          npm ci
          npm run build

      - name: Package extension
        run: |
          mkdir -p release/zoom-auto-admit-web
          cp -R web-extension/dist/. release/zoom-auto-admit-web/
          cp web-extension/README.md release/zoom-auto-admit-web/README.md
          cd release
          zip -r ../zoom-auto-admit-web.zip zoom-auto-admit-web
          cd ..
          unzip -t zoom-auto-admit-web.zip

      - name: Replace asset and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload web-v0.2.0 zoom-auto-admit-web.zip --clobber
          gh release edit web-v0.2.0 \
            --title "Zoom Auto Admit Web v0.3.1 — Attendance & OpenRouter" \
            --notes-file web-extension/RELEASE_NOTES.md
